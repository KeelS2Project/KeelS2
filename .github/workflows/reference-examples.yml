name: reference-examples
on:
  push:
    branches: [main]
    paths:
      - tests/reference-examples/**
      - .github/workflows/reference-examples.yml
      - sdk/**
      - cmake/**
      - samples/**
      - tests/*_c_abi.c
      - tests/fixtures/adapter/**
      - CMakeLists.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the matching SDK and compile reference sources
        run: python tests/reference-examples/build.py --work out/reference-examples
      - name: Preserve compilation provenance and example modules
        uses: actions/upload-artifact@v4
        with:
          name: reference-examples-${{ runner.os }}-${{ github.sha }}
          path: |
            out/reference-examples/result.json
            out/reference-examples/tests.xml
            out/reference-examples/build/**/*.so
            out/reference-examples/build/**/*.dll
          if-no-files-found: error
