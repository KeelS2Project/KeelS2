name: build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and verify the release path
        run: python tools/release.py build --project-suffix ci --configuration Release
      - name: Preserve release and live-gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keels2-${{ runner.os }}-${{ github.sha }}
          path: out/releases/v0.9.0-ci/*
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B out/sanitizers
          -DKEELS2_GAME=cs2
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build ASan and UBSan
        run: cmake --build out/sanitizers --parallel
      - name: Test ASan and UBSan
        run: ctest --test-dir out/sanitizers --output-on-failure --timeout 900
